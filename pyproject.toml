[project]
name = "cohortgen"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flujo",
    "athena-client==1.0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24",
    "ipython",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cohortgen"]
# Ensure top-level sitecustomize.py is included in wheels
[tool.hatch.build.targets.wheel.force-include]
"src/sitecustomize.py" = "sitecustomize.py"

[tool.uv]
package = true

[tool.uv.sources]
flujo = { git = "https://github.com/aandresalvarez/flujo.git", rev = "519919f0cf6a519f33a9c77bb2ad36b81f925d7e" }

[project.scripts]
cohortgen = "cohortgen.cli:main"
