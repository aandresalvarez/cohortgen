[project]
name = "cohortgen"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flujo",
    # Pin to a version that still provides openai.resources.chat.Chat
    "openai==1.99.9",
    "athena-client==1.0.27",
    "google-cloud-bigquery>=3.19.0,<4.0.0",
    "sqlalchemy-bigquery>=1.10.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24",
    "ipython",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cohortgen"]
# Ensure top-level sitecustomize.py is included in wheels
[tool.hatch.build.targets.wheel.force-include]
"src/sitecustomize.py" = "sitecustomize.py"

[tool.uv]
package = true

[tool.uv.sources]
flujo = { git = "https://github.com/aandresalvarez/flujo.git", rev = "b8db12cb3175656c21d4e0601c4a3cc3f0155356" }

[project.scripts]
cohortgen = "cohortgen.cli:main"
