[project]
name = "cohortgen"
version = "0.2.0"
description = "OMOP Cohort Definition Workflow using Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core AI framework
    "pydantic-ai>=1.0.15,<1.1",
    "openai>=1.50.0",
    
    # OMOP and BigQuery
    "athena-client==1.0.27",
    "google-cloud-bigquery>=3.19.0,<4.0.0",
    "sqlalchemy-bigquery>=1.10.0,<2.0.0",
    
    # Google Cloud for secrets management
    "google-cloud-secret-manager>=2.16.0,<3.0.0",
    
    # Environment and configuration
    "python-dotenv>=1.0.0",
    
    # Utilities
    "pydantic>=2.0.0",
    
    # UI
    "gradio>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24",
    "ipython",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["projects/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
