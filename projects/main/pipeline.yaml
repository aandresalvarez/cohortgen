version: "0.1"
name: "cohort_orchestrator"

pipeline_config:
  conversation_mode: true

imports:
  clarification: "../clarification/pipeline.yaml"
  concept_discovery: "../concept_discovery/pipeline.yaml"
  query_builder: "../query_builder/pipeline.yaml"

agents:
  clarification_agent:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert clinical data analyst. Use the conversation history and current input to drive a slot-filling clarification.
      - Required slots: metric, cohort/population, time window, grouping/dimensions, filters/exclusions.
      - Maintain a running slots map; never re-ask filled slots. Assume short replies answer the last question unless contradicted.
      - Ask ONE clarifying question per turn that references the initial goal.
      - Output exactly {"action":"ask","question":"..."} or {"action":"finish"}.
    output_schema:
      type: object
      properties:
        action: { type: string, enum: [ask, finish] }
        question: { type: string }
      required: [action]

  cohort_definer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert clinical researcher and OMOP CDM cohort designer.
      Write a strong, unambiguous plain‑text cohort definition to be implemented later in ATLAS (no SQL, no JSON).
      Use the initial goal, the full clarification Q/A, and the synthesized slots. Resolve ambiguity by proposing explicit, conservative defaults and label them as "Assumption:" when necessary.
      Output one section titled "Final Cohort Definition" with a numbered outline (index event, entry criteria, population constraints, visit/setting, time window, exclusions, exit, assumptions).
    output_schema: { type: string }

  concept_decomposer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an OMOP/ATLAS cohort designer. From the cohort definition, produce a structured concept plan.
      - For each concept set: name, intent, optional domain, vocab hints, include_descendants (default true), standard_only (default true), queries[].
      Output ONLY JSON for schema {concept_sets:[{name, intent?, domain?, vocabulary?, include_descendants?, standard_only?, queries[]}]}.
    output_schema:
      type: object
      properties:
        concept_sets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              intent: { type: string }
              domain: { type: string }
              vocabulary: { type: array, items: { type: string } }
              include_descendants: { type: boolean, default: true }
              standard_only: { type: boolean, default: true }
              queries: { type: array, items: { type: string } }
            required: [name, queries]

  concept_summarizer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an OMOP/ATLAS cohort implementer. Combine the concept plan and Athena search results into a final JSON spec.
      - For each concept set: name, concept_ids, include_descendants, standard_only. Use only IDs from Athena results.
      - Output ONLY JSON.
    output_schema: { type: string }

  sql_generator:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert OMOP CDM (v5.x) SQL developer targeting BigQuery Standard SQL.
      Generate a single, runnable BigQuery SQL query that implements the provided cohort definition using the supplied concept sets.
      Requirements: qualify all OMOP tables with provided project.dataset; standard concepts unless specified; single statement or CTE ending in final SELECT. Output ONLY SQL.
    output_schema: { type: string }

  sql_fixer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You fix BigQuery Standard SQL queries. Given original SQL and a BigQuery dry-run error, return corrected SQL while preserving project.dataset qualifiers. Output ONLY SQL.
    output_schema: { type: string }

  # No special agents needed for imports-based subflows

steps:
  # 0) Capture initial goal at the top-level
  - kind: hitl
    name: get_initial_goal
    message: "What would you like to accomplish?"
    updates_context: true

  # Clarification sub-pipeline (always)
  - kind: step
    name: run_clarification_subpipeline
    uses: imports.clarification
    input: |
      {{ steps.get_initial_goal.output }}

  - kind: step
    name: status_definition_ready
    agent:
      id: "flujo.builtins.stringify"
    updates_context: true
    input: |
      ✅ Definition ready (sub-pipeline)

  # 2) Concept discovery sub-pipeline (always)
  - kind: step
    name: run_concept_discovery_subpipeline
    uses: imports.concept_discovery
    input: |
      {{ context.scratchpad.cohort_definition }}
  

  # Status: concepts ready
  - kind: step
    name: status_concepts_ready
    agent:
      id: "flujo.builtins.stringify"
    updates_context: true
    input: |
      ✅ Concepts ready

  # 3) Query builder sub-pipeline (always)
  - kind: step
    name: run_query_builder_subpipeline
    uses: imports.query_builder
    input: |
      {{ {"cohort_definition": context.scratchpad.cohort_definition, "concept_sets": context.scratchpad.concept_sets} | tojson }}

  - kind: step
    name: status_sql_validated
    agent:
      id: "flujo.builtins.stringify"
    input: |
      ✅ SQL validated (sub-pipeline)
