version: "0.1"
name: "cohort_orchestrator"

pipeline_config:
  conversation_mode: true

agents:
  clarification_agent:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert clinical data analyst. Use the conversation history and current input to drive a slot-filling clarification.
      - Required slots: metric, cohort/population, time window, grouping/dimensions, filters/exclusions.
      - Maintain a running slots map; never re-ask filled slots. Assume short replies answer the last question unless contradicted.
      - Ask ONE clarifying question per turn that references the initial goal.
      - Output exactly {"action":"ask","question":"..."} or {"action":"finish"}.
    output_schema:
      type: object
      properties:
        action: { type: string, enum: [ask, finish] }
        question: { type: string }
      required: [action]

  cohort_definer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert clinical researcher and OMOP CDM cohort designer.
      Write a strong, unambiguous plain‑text cohort definition to be implemented later in ATLAS (no SQL, no JSON).
      Use the initial goal, the full clarification Q/A, and the synthesized slots. Resolve ambiguity by proposing explicit, conservative defaults and label them as "Assumption:" when necessary.
      Output one section titled "Final Cohort Definition" with a numbered outline (index event, entry criteria, population constraints, visit/setting, time window, exclusions, exit, assumptions).
    output_schema: { type: string }

  concept_decomposer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an OMOP/ATLAS cohort designer. From the cohort definition, produce a structured concept plan.
      - For each concept set: name, intent, optional domain, vocab hints, include_descendants (default true), standard_only (default true), queries[].
      Output ONLY JSON for schema {concept_sets:[{name, intent?, domain?, vocabulary?, include_descendants?, standard_only?, queries[]}]}.
    output_schema:
      type: object
      properties:
        concept_sets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              intent: { type: string }
              domain: { type: string }
              vocabulary: { type: array, items: { type: string } }
              include_descendants: { type: boolean, default: true }
              standard_only: { type: boolean, default: true }
              queries: { type: array, items: { type: string } }
            required: [name, queries]

  concept_summarizer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an OMOP/ATLAS cohort implementer. Combine the concept plan and Athena search results into a final JSON spec.
      - For each concept set: name, concept_ids, include_descendants, standard_only. Use only IDs from Athena results.
      - Output ONLY JSON.
    output_schema: { type: string }

  sql_generator:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert OMOP CDM (v5.x) SQL developer targeting BigQuery Standard SQL.
      Generate a single, runnable BigQuery SQL query that implements the provided cohort definition using the supplied concept sets.
      Requirements: qualify all OMOP tables with provided project.dataset; standard concepts unless specified; single statement or CTE ending in final SELECT. Output ONLY SQL.
    output_schema: { type: string }

  sql_fixer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You fix BigQuery Standard SQL queries. Given original SQL and a BigQuery dry-run error, return corrected SQL while preserving project.dataset qualifiers. Output ONLY SQL.
    output_schema: { type: string }

steps:
  # 0) Capture initial goal at the top-level
  - kind: hitl
    name: get_initial_goal
    message: "What would you like to accomplish?"
    updates_context: true

  # 1) Clarification loop (LLM asks; user answers) until finish
  - kind: loop
    name: clarification_loop
    loop:
      conversation: true
      history_management:
        strategy: truncate_tokens
        max_tokens: 3000
      ai_turn_source: named_steps
      user_turn_sources: ["hitl"]
      named_steps: ["check_if_more_info_needed"]
      history_template: |
        --- Task Context ---
        Initial goal: {{history.0.content}}
        Recent turns:
        {{#each history}}{{ this.role }}: {{ this.content }}
        {{/each}}
        Instruction:
          Ask ONE clarifying question that explicitly references the initial goal {{history.0.content}}.
          If goal is clear, output {"action":"finish"}.
      body:
        - kind: step
          name: check_if_more_info_needed
          uses: agents.clarification_agent
          input: |
            --- Conversation So Far ---
            {{#each context.hitl_history}}
            assistant: {{ this.message_to_human }}
            user: {{ this.human_response }}
            {{/each}}

            --- Instruction ---
            Initial goal: {{ steps.get_initial_goal.output }}
            Ask ONE clarifying question referencing the goal and the conversation. If all slots are filled, output {"action":"finish"}.

        - kind: conditional
          name: ask_question_if_needed
          condition_expression: "previous_step.action == 'ask'"
          branches:
            true:
              - kind: hitl
                name: ask_user_for_clarification
                message: "{{ steps.check_if_more_info_needed.output.question }}"
                updates_context: true
            false:
              - kind: step
                name: passthrough
                agent: "flujo.builtins.passthrough"

      exit_expression: |
        (
          steps['check_if_more_info_needed'] and
          steps['check_if_more_info_needed'].action == 'finish'
        )
      max_loops: 6

  - kind: step
    name: synthesize_slots
    uses: "flujo.helpers.slot_synthesis:synthesize_slots"
    updates_context: true

  - kind: step
    name: generate_cohort_definition
    uses: agents.cohort_definer
    input: |
      Initial goal: {{ steps.get_initial_goal.output }}

      Clarifications (chronological):
      {{#each context.hitl_history}}
      Q: {{ this.message_to_human }}
      A: {{ this.human_response }}
      {{/each}}

      Synthesized slots:
      {{ context.scratchpad.slots | tojson }}

      Task: Produce the Final Cohort Definition per your system instructions. No code or SQL.

  - kind: step
    name: store_cohort_definition
    uses: "skills.custom_tools:store_as_cohort_definition"
    input: "{{ steps.generate_cohort_definition.output }}"
    updates_context: true

  # Status: definition ready
  - kind: step
    name: status_definition_ready
    agent:
      id: "flujo.builtins.stringify"
    input: |
      ✅ Definition ready

  # 2) Concept discovery (LLM + Athena search)
  - kind: step
    name: decompose_concept_sets
    uses: agents.concept_decomposer
    input: |
      Cohort definition:
      {{ context.scratchpad.cohort_definition }}

      Output ONLY a JSON object that matches the required schema.

  - kind: step
    name: prepare_athena_plan
    uses: "skills.custom_tools:ensure_concept_plan_dict"

  - kind: step
    name: search_athena
    uses: "skills.athena_tools:athena_search_for_concept_plan"
    updates_context: true

  - kind: step
    name: summarize_concept_sets
    uses: agents.concept_summarizer
    input: |
      Initial cohort definition:
      {{ context.scratchpad.cohort_definition }}

      Concept plan (from decomposer):
      {{ steps.decompose_concept_sets.output | tojson }}

      Athena search results:
      {{ steps.search_athena.output | tojson }}

      Output ONLY the final JSON spec with fields: concept_sets:[{name, concept_ids, include_descendants, standard_only}], assumptions:[...].

  - kind: step
    name: normalize_concept_sets
    uses: "skills.custom_tools:ensure_dict"
    input: "{{ steps.summarize_concept_sets.output }}"

  - kind: conditional
    name: ensure_nonempty_concepts
    condition_expression: "not previous_step.get('concept_sets')"
    branches:
      true:
        - kind: step
          name: default_concept_plan
          uses: "skills.custom_tools:default_influenza_concept_plan"

        - kind: step
          name: search_athena_fallback
          uses: "skills.athena_tools:athena_search_for_concept_plan"
          input: "{{ steps.default_concept_plan.output | tojson }}"

        - kind: step
          name: summarize_concepts_fallback
          uses: agents.concept_summarizer
          input: |
            Initial cohort definition:
            {{ context.scratchpad.cohort_definition }}

            Concept plan (fallback):
            {{ steps.default_concept_plan.output | tojson }}

            Athena search results:
            {{ steps.search_athena_fallback.output | tojson }}

            Output ONLY the final JSON spec with fields: concept_sets:[{name, concept_ids, include_descendants, standard_only}], assumptions:[...].

        - kind: step
          name: normalize_concepts_fallback
          uses: "skills.custom_tools:ensure_dict"
          input: "{{ steps.summarize_concepts_fallback.output }}"
      false:
        - kind: step
          name: passthrough_concepts_nonempty
          agent: "flujo.builtins.passthrough"

  - kind: step
    name: store_concept_sets
    uses: "skills.custom_tools:store_as_concept_sets"
    input: "{{ steps.normalize_concepts_fallback.output or steps.normalize_concept_sets.output }}"
    updates_context: true

  # Status: concepts ready
  - kind: step
    name: status_concepts_ready
    agent:
      id: "flujo.builtins.stringify"
    input: |
      ✅ Concepts ready

  # 3) Query builder (LLM + BigQuery dry-run with fixes)
  - kind: step
    name: resolve_omop_dataset_id
    uses: "skills.custom_tools:get_env_value"
    input: |
      {{ {"name": "OMOP_DATASET_ID", "default": "bigquery-public-data.cms_synthetic_patient_data_omop"} | tojson }}

  - kind: step
    name: resolve_bq_location
    uses: "skills.custom_tools:get_env_value"
    input: |
      {{ {"name": "BIGQUERY_LOCATION", "default": "US"} | tojson }}

  - kind: step
    name: resolve_bq_project_id
    uses: "skills.custom_tools:get_env_value"
    input: |
      {{ {"name": "BIGQUERY_PROJECT_ID", "default": ""} | tojson }}

  - kind: step
    name: generate_sql
    uses: agents.sql_generator
    input: |
      Cohort definition:
      {{ context.scratchpad.cohort_definition }}

      Concept sets JSON:
      {{ context.scratchpad.concept_sets | tojson }}

      BigQuery OMOP prefix:
      {{ steps.resolve_omop_dataset_id.output }}

      Output ONLY SQL.

  - kind: step
    name: dry_run_1
    uses: "skills.bq_tools:bq_dry_run"
    input: |
      {{ {
        "sql": steps.generate_sql.output,
        "project_id": steps.resolve_bq_project_id.output,
        "default_dataset": steps.resolve_omop_dataset_id.output,
        "location": (steps.resolve_bq_location.output or "US")
      } | tojson }}
    updates_context: true

  - kind: conditional
    name: fix_if_fail_1
    condition_expression: "not steps['dry_run_1'].success"
    branches:
      true:
        - kind: step
          name: fix_sql_1
          uses: agents.sql_fixer
          input: |
            Original SQL:
            {{ steps.generate_sql.output }}

            BigQuery error (from dry run):
            {{ steps.dry_run_1.output | tojson }}

            Output ONLY corrected SQL.

        - kind: step
          name: dry_run_2
          uses: "skills.bq_tools:bq_dry_run"
          input: |
            {{ {
              "sql": steps.fix_sql_1.output,
              "project_id": steps.resolve_bq_project_id.output,
              "default_dataset": steps.resolve_omop_dataset_id.output,
              "location": (steps.resolve_bq_location.output or "US")
            } | tojson }}

        - kind: conditional
          name: fix_if_fail_2
          condition_expression: "not steps['dry_run_2'].success"
          branches:
            true:
              - kind: step
                name: fix_sql_2
                uses: agents.sql_fixer
                input: |
                  Original SQL:
                  {{ steps.fix_sql_1.output }}

                  BigQuery error (from dry run):
                  {{ steps.dry_run_2.output | tojson }}

                  Output ONLY corrected SQL.

              - kind: step
                name: dry_run_3
                uses: "skills.bq_tools:bq_dry_run"
                input: |
                  {{ {
                    "sql": steps.fix_sql_2.output,
                    "project_id": steps.resolve_bq_project_id.output,
                    "default_dataset": steps.resolve_omop_dataset_id.output,
                    "location": (steps.resolve_bq_location.output or "US")
                  } | tojson }}
            false:
              - kind: step
                name: passthrough_2
                agent: "flujo.builtins.passthrough"
      false:
        - kind: step
          name: passthrough_1
          agent: "flujo.builtins.passthrough"

  - kind: step
    name: final_sql
    agent: "flujo.builtins.passthrough"
    input: |
      {{ steps.fix_sql_2.output or steps.fix_sql_1.output or steps.generate_sql.output }}

  - kind: step
    name: store_final_sql
    uses: "skills.custom_tools:wrap_in_scratchpad"
    input: |
      {{ {"data": steps.final_sql.output, "key": "final_sql"} | tojson }}
    updates_context: true

  # Status: SQL validated (or generated)
  - kind: step
    name: status_sql_validated
    agent:
      id: "flujo.builtins.stringify"
    input: |
      ✅ SQL validated
