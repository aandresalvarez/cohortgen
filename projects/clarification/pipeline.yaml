# 📂 flujo project/pipeline.yaml (Final Corrected Version)

version: "0.1"
name: "adaptive_clarification_workflow"

agents:
  clarification_agent:
    model: "openai:gpt-4o"
    system_prompt: |
      You are an expert clinical data analyst. Your job is to determine if a user's goal is clear enough to create a detailed plan.
      You will receive the original goal and the conversation history so far.

      Analyze the history and goal.
      - If there are still ambiguities, you MUST ask ONE more clarifying question.
      - If the goal is completely clear, you MUST signal that you are finished.

      Your output MUST be a single JSON object with one of two actions:

      1. To ask a question:
         { "action": "ask", "question": "Your specific question here." }

      2. To finish clarifying:
         { "action": "finish" }
    output_schema:
      type: object
      properties:
        action:
          type: string
          enum: [ask, finish]
        question:
          type: string
      required: [action]

  planner:
    model: "openai:gpt-4o"
    system_prompt: |
      You are a planning expert. Create a practical action plan based on the user's EXACT goal and their clarifications.
      The clarifications contain the full conversation history.

      CRITICAL: You must create a REAL, SPECIFIC plan, not a template. Replace all placeholder text.
      
      Format:
      # Plan: [User's Original Goal]
      
      ## What You'll Create
      [A specific description of what will be created]
      
      ## Action Steps
      1. [The actual first step]
      2. [The actual second step]
      ...
      
      ## Timeline
      [How long it will actually take]
      
      ## What You Need
      [Actual tools, resources, materials needed]
      
      ## You'll Know You Succeeded When
      [Specific success criteria]
    output_schema:
      type: string

steps:
  - kind: hitl
    name: get_initial_goal
    message: "What would you like to accomplish?"
    updates_context: true

  - kind: loop
    name: clarification_loop
    loop:
      body:
        # First, the agent decides whether to ask a question or finish.
        - kind: step
          name: check_if_more_info_needed
          uses: agents.clarification_agent
        
        # This conditional step uses the agent's decision to either ask a question or do nothing.
        - kind: conditional
          name: ask_question_if_needed
          # 👇 THIS IS THE CORRECTED LINE 👇
          condition: "skills.helpers:check_clarification_action"
          branches:
            ask:
              - kind: hitl
                name: ask_user_for_clarification
                message: "{{ previous_step.output.question }}"
            skip:
              - kind: step
                name: passthrough
                agent: "flujo.builtins.passthrough"

      exit_condition: "skills.helpers:is_finish_command"
      max_loops: 5
      initial_input_mapper: "skills.helpers:map_initial_input"
      iteration_input_mapper: "skills.helpers:map_iteration_input"
      loop_output_mapper: "skills.helpers:map_loop_output"

  - kind: step
    name: generate_plan
    uses: agents.planner
    input: "{{ previous_step.output }}"