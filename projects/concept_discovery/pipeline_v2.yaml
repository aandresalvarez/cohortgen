version: "0.1"
name: "concept_discovery_pipeline_v2"

pipeline_config:
  conversation_mode: true

agents:
  # PHASE 1: Decomposition
  concept_decomposer:
    model: "openai:gpt-5-mini"
    model_settings:
      reasoning: { effort: "medium" }
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert OMOP/ATLAS cohort designer. Task: Read the cohort definition and produce a structured plan of concept sets to build in ATHENA.
      
      Strict requirements:
      - No placeholders. Do NOT emit generic tokens like <CONDITION_NAME>.
      - Derive concrete query terms directly from the user's cohort definition.
      - Prefer standard concepts only ('S') unless the definition requires non‑standard.
      - Suggest domain/vocabulary restrictions when clear (e.g., SNOMED for conditions, RxNorm for drugs).
      - Include whether to include descendants (true by default).
      
      Output ONLY a valid JSON object.
    output_schema:
      type: object
      properties:
        concept_sets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              intent: { type: string }
              domain: { type: string }
              vocabulary: { type: array, items: { type: string } }
              include_descendants: { type: boolean, default: true }
              standard_only: { type: boolean, default: true }
              queries: { type: array, items: { type: string } }
            required: [name, queries]

  # PHASE 2: Validation (used for each concept set)
  concept_validator:
    model: "openai:gpt-5-mini"
    model_settings:
      reasoning: { effort: "low" }
    timeout: 60
    max_retries: 1
    system_prompt: |
      You are an OMOP concept quality validator. Your task is to review candidates for a SINGLE concept set and assess their quality.
      
      Review criteria:
      1. **Relevance**: Do candidates match the intended concept set meaning?
      2. **Standard status**: Are all candidates standard concepts (vocabulary_id = SNOMED, standard_concept = 'S')?
      3. **Domain correctness**: Are they in the right domain (Condition, Drug, etc.)?
      4. **Completeness**: Are key subtypes or variants missing?
      5. **False positives**: Are there irrelevant concepts that should be excluded?
      
      Output format:
      - quality_score: 1-10 (10 = perfect)
      - issues: list of problems found
      - missing_concepts: concepts that should be added (if any)
      - exclude_concepts: concept_ids that should be removed
      - recommendations: what to do next
      
      Be concise and specific. Output ONLY valid JSON.
    output_schema:
      type: object
      properties:
        quality_score: { type: integer, minimum: 1, maximum: 10 }
        issues: { type: array, items: { type: string } }
        missing_concepts: { type: array, items: { type: string } }
        exclude_concepts: { type: array, items: { type: integer } }
        recommendations: { type: string }
      required: [quality_score, issues, recommendations]

  # PHASE 3: Decision maker
  refinement_decision_agent:
    model: "openai:gpt-5-mini"
    model_settings:
      reasoning: { effort: "low" }
    timeout: 60
    max_retries: 1
    system_prompt: |
      You are a quality assurance agent for OMOP concept sets. Review the validation results for ALL concept sets and decide if they're ready to finalize.
      
      Decision criteria:
      - If average quality_score >= 8 and no critical issues: FINISH
      - If quality_score < 8 or critical issues exist: REFINE
      - If already refined 2+ times: FINISH (accept current state)
      
      Output:
      - decision: "finish" or "refine"
      - reason: brief explanation
      - priority_actions: what to fix if refining
      
      Output ONLY valid JSON.
    output_schema:
      type: object
      properties:
        decision: { type: string, enum: [finish, refine] }
        reason: { type: string }
        priority_actions: { type: array, items: { type: string } }
      required: [decision, reason]

steps:
  # ========================================================================
  # PHASE 1: DECOMPOSITION & INITIAL SEARCH
  # ========================================================================
  
  - kind: step
    name: parse_initial_payload
    uses: "skills.custom_tools:parse_initial_payload"
    input: "{{ context.initial_prompt }}"
    updates_context: true

  - kind: step
    name: decompose_concept_sets
    uses: agents.concept_decomposer
    input: "{{ context.scratchpad.cohort_definition }}"

  - kind: step
    name: normalize_concept_plan
    uses: "skills.custom_tools:ensure_concept_plan_dict"
    input: "{{ previous_step }}"

  - kind: step
    name: search_initial_candidates
    uses: "skills.athena_tools:athena_search_for_concept_plan"
    input: "{{ previous_step }}"
    updates_context: true

  # ========================================================================
  # PHASE 2: Extract concept sets for map iteration
  # ========================================================================
  
  - kind: step
    name: prepare_for_validation
    uses: "skills.custom_tools:extract_concept_sets_for_map"
    input: ""
  
  # ========================================================================
  # PHASE 2: PARALLEL VALIDATION (using map over concept sets)
  # ========================================================================
  
  - kind: map
    name: validate_all_concept_sets
    map:
      iterable_input: steps.prepare_for_validation.output
      body:
        - kind: step
          name: validate_single_set
          uses: agents.concept_validator
          input: |
            Concept Set Name: {{ this.name }}
            Intent: {{ this.notes }}
            Candidates: {{ this.candidates | tojson }}
            
            Please validate the quality of these candidates for the concept set.

  # ========================================================================
  # PHASE 3: AGGREGATION & DECISION
  # ========================================================================
  
  - kind: step
    name: aggregate_validations
    uses: "skills.custom_tools:aggregate_validation_results"
    input:
      concept_sets: "{{ context.scratchpad.concept_sets }}"
      validations: "{{ steps.validate_all_concept_sets.output }}"
    updates_context: true

  - kind: step
    name: decide_refinement
    uses: agents.refinement_decision_agent
    input: |
      Validation Results: {{ context.scratchpad.validation_summary | tojson }}
      Refinement Count: {{ context.scratchpad.refinement_count | default(0) }}
      
      Should we finish or refine the concept sets?

  # ========================================================================
  # PHASE 4: CONDITIONAL REFINEMENT LOOP
  # ========================================================================
  
  - kind: loop
    name: refinement_loop
    loop:
      body:
        - kind: conditional
          name: check_if_refine_needed
          condition_expression: "steps['decide_refinement'].decision == 'refine'"
          branches:
            "true":
              - kind: step
                name: apply_refinements
                uses: "skills.custom_tools:apply_concept_refinements"
                input:
                  concept_sets: "{{ context.scratchpad.concept_sets }}"
                  validations: "{{ context.scratchpad.validation_summary }}"
                updates_context: true
              
              - kind: step
                name: prepare_for_revalidation
                uses: "skills.custom_tools:extract_concept_sets_for_map"
                input: ""
              
              - kind: map
                name: revalidate_concept_sets
                map:
                  iterable_input: steps.prepare_for_revalidation.output
                  body:
                    - kind: step
                      name: validate_refined_set
                      uses: agents.concept_validator
                      input: |
                        Concept Set Name: {{ this.name }}
                        Intent: {{ this.notes }}
                        Candidates: {{ this.candidates | tojson }}
                        
                        Please validate the quality after refinement.
              
              - kind: step
                name: reaggregate_validations
                uses: "skills.custom_tools:aggregate_validation_results"
                input:
                  concept_sets: "{{ context.scratchpad.concept_sets }}"
                  validations: "{{ steps.revalidate_concept_sets.output }}"
                updates_context: true
              
              - kind: step
                name: increment_refinement_count
                uses: "skills.custom_tools:increment_counter"
                input: "{{ context.scratchpad.refinement_count | default(0) }}"
                updates_context: true
              
              - kind: step
                name: redecide_refinement
                uses: agents.refinement_decision_agent
                input: |
                  Validation Results: {{ context.scratchpad.validation_summary | tojson }}
                  Refinement Count: {{ context.scratchpad.refinement_count }}
                  
                  Should we finish or refine again?
            
            "false":
              - kind: step
                name: skip_refinement
                agent: "flujo.builtins.passthrough"
                input: "refinement_not_needed"
      
      exit_expression: "steps['decide_refinement'].decision == 'finish' or (context.scratchpad.refinement_count | default(0)) >= 3"
      max_loops: 3

  # ========================================================================
  # PHASE 5: FINALIZATION
  # ========================================================================
  
  - kind: step
    name: finalize_concept_sets
    uses: "skills.custom_tools:finalize_concept_sets"
    input:
      concept_sets: "{{ context.scratchpad.concept_sets }}"
      validations: "{{ context.scratchpad.validation_summary }}"
    updates_context: true

  - kind: step
    name: emit_for_parent
    agent: "flujo.builtins.passthrough"
    input: "{{ context.scratchpad.final_concept_sets | tojson }}"

