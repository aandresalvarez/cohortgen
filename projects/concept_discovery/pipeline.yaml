version: "0.1"
name: "concept_discovery_pipeline"

pipeline_config:
  conversation_mode: true

agents:
  concept_decomposer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert OMOP/ATLAS cohort designer.
      Task: Read the cohort definition and produce a structured plan of concept sets to build in ATHENA.
      - Focus only on concept sets that are needed to implement the cohort (index events, inclusion/exclusion conditions, exposures, procedures, measurements, observations, visits).
      - Prefer standard concepts only (standard_concept = 'S') unless the definition explicitly needs non-standard.
      - Suggest domain restrictions and vocabulary preferences when clear (e.g., SNOMED for conditions, RxNorm for drugs, CPT/HCPCS for procedures, LOINC for labs), but do not overconstrain if unclear.
      - Include whether to include descendants for each set (true by default for intent-based concept sets).
      - Generate multiple query terms per set when helpful to capture synonyms.
      Output ONLY a valid JSON object that adheres to the schema.
    output_schema:
      type: object
      properties:
        concept_sets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              intent: { type: string, description: "short description of purpose" }
              domain: { type: string, description: "OMOP DomainId like Condition, Drug, Procedure, Measurement, Observation, Visit" }
              vocabulary: { type: array, items: { type: string }, description: "Optional vocabulary hints like SNOMED, RxNorm, LOINC" }
              include_descendants: { type: boolean, default: true }
              standard_only: { type: boolean, default: true }
              queries: { type: array, items: { type: string } }
            required: [name, queries]

  concept_summarizer:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "low"
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert OMOP/ATLAS cohort implementer.
      Combine the concept plan, refined standard concepts (if available), and Athena search results into a final JSON spec of concept sets for ATLAS.
      - Prefer the refined agent output when present; otherwise, select from raw search results.
      - For each concept set, output:
        - name
        - concepts: array of { concept_id, concept_name }
        - concept_ids: array of integers (derived from concepts; keep for backward compatibility)
        - concept_names: array of strings (derived from concepts)
        - include_descendants
        - standard_only
      - Select only standard concepts (standard_concept = 'S'). Do NOT include classification concepts ('C') unless explicitly required by the cohort definition with a clear rationale.
      - Do not invent concept IDs or names; only use those returned by the Athena search results (candidates).
      - If a concept set has zero candidates, add a note under assumptions to revisit the queries.
      Output ONLY JSON. No commentary.
    output_schema: { type: string }

  concept_refiner:
    model: "openai:gpt-5-mini"
    model_settings:
      openai_reasoning_effort: "medium"
    timeout: 180
    max_retries: 1
    system_prompt: |
      You are an expert OMOP concept explorer.
      Goal: Given a concept plan and initial Athena search results, identify STANDARD (standard_concept = 'S') concept IDs for each concept set by exploring candidates.
      You can call tools to search, fetch details, relationships, summaries, and graphs. Use them iteratively when needed:
        - Use relationships to follow 'Maps to' from non-standard to standard concepts.
        - Use 'Is a' / hierarchy or graph to select the most appropriate standard concepts for the intent.
        - Prefer domain/vocabulary hints in the plan (e.g., SNOMED for conditions, RxNorm for drugs, LOINC for labs).
        - If initial candidates are classification ('C') or non-standard, explore related concepts to find standard ('S').
        - Be conservative; avoid over-inclusion. Choose the minimal set that captures the intent.
      Output ONLY JSON with fields:
        - concept_sets: [ { name, concepts: [{ concept_id, concept_name }], include_descendants, standard_only } ]
        - assumptions: [ ... ]
      Do NOT invent or guess IDs. Only include IDs you retrieved via tools.
    tools:
      - "skills.athena_tools:athena_search"
      - "skills.athena_tools:athena_details"
      - "skills.athena_tools:athena_relationships"
      - "skills.athena_tools:athena_summary"
      - "skills.athena_tools:athena_graph"
    output_schema: { type: string }

steps:
  - kind: conditional
    name: resolve_cohort_definition
    condition_expression: "(not context.initial_prompt) and (context.scratchpad.get('status') != 'paused')"
    branches:
      true:
        - kind: hitl
          name: get_cohort_definition
          message: "Paste the cohort definition (plain text from your study protocol or a prior clarification)."
          updates_context: true
      false:
        - kind: step
          name: get_cohort_definition
          agent: "flujo.builtins.passthrough"
          input: "{{ context.initial_prompt }}"
          updates_context: true

  - kind: conditional
    name: stop_if_parent_paused
    condition_expression: "context.scratchpad.get('status') == 'paused'"
    branches:
      true:
        - kind: step
          name: noop_concept_discovery
          agent: "flujo.builtins.passthrough"
          input: "parent_paused"
      false:
        - kind: step
          name: decompose_concept_sets
          uses: agents.concept_decomposer
          input: |
            Cohort definition:
            {{ steps.get_cohort_definition.output }}

            Output ONLY a JSON object that matches the required schema.

        - kind: step
          name: prepare_athena_plan
          uses: "skills.custom_tools:ensure_concept_plan_dict"

        - kind: step
          name: search_athena
          uses: "skills.athena_tools:athena_search_for_concept_plan"
          updates_context: true

  - kind: step
    name: refine_to_standard_concepts
    uses: agents.concept_refiner
    input: |
      Cohort definition:
      {{ steps.get_cohort_definition.output }}

      Concept plan:
      {{ steps.prepare_athena_plan.output | tojson }}

      Initial Athena search results:
      {{ steps.search_athena.output | tojson }}

      Task: For each concept set, select standard ('S') concepts by exploring the initial candidates and their relationships.
      - Favor 'Maps to' relationships from non-standard to standard concepts.
      - Use details/summary/graph for disambiguation when necessary.
      - Respect domain and vocabulary hints from the plan where clear.
      Output ONLY JSON: { concept_sets: [{ name, concepts: [{concept_id, concept_name}], include_descendants, standard_only }], assumptions: [] }

  - kind: step
    name: summarize_concept_sets
    uses: agents.concept_summarizer
    input: |
      Initial cohort definition:
      {{ steps.get_cohort_definition.output }}

            Concept plan (from decomposer):
            {{ steps.decompose_concept_sets.output | tojson }}

            Athena search results:
            {{ steps.search_athena.output | tojson }}

      Refined standard concepts (from explorer):
      {{ steps.refine_to_standard_concepts.output | tojson }}

      Output ONLY the final JSON spec with fields:
      - concept_sets: [
          {
            name,
            concepts: [{ concept_id, concept_name }],
            concept_ids,  # keep for backward compatibility
            concept_names,
            include_descendants,
            standard_only
          }
        ]
      - assumptions: [...]
