version: "0.1"
name: "concept_discovery_pipeline"

pipeline_config:
  conversation_mode: true

agents:
  concept_decomposer:
    model: "openai:gpt-5-mini"
    model_settings:
      reasoning: { effort: "medium" }
    timeout: 120
    max_retries: 1
    system_prompt: |
      You are an expert OMOP/ATLAS cohort designer. Task: Read the cohort definition and produce a structured plan of concept sets to build in ATHENA.
      Strict requirements:
      - No placeholders. Do NOT emit generic tokens like <CONDITION_NAME>.
      - Derive concrete query terms directly from the user's cohort definition.
      - Prefer standard concepts only ('S') unless the definition requires non‑standard.
      - Suggest domain/vocabulary restrictions when clear (e.g., SNOMED for conditions, RxNorm for drugs).
      - Include whether to include descendants (true by default).
      Output ONLY a valid JSON object.
    output_schema:
      type: object
      properties:
        concept_sets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              intent: { type: string }
              domain: { type: string }
              vocabulary: { type: array, items: { type: string } }
              include_descendants: { type: boolean, default: true }
              standard_only: { type: boolean, default: true }
              queries: { type: array, items: { type: string } }
            required: [name, queries]

  concept_explorer_agent:
    model: "openai:gpt-5-mini"
    model_settings:
      reasoning: { effort: "medium" }
    timeout: 180
    max_retries: 1
    system_prompt: |
      You are an expert OMOP concept explorer. Your goal is to build a final, high-quality list of STANDARD OMOP concepts.
      You are inside an exploration loop. On each turn, you will be given the current state of the concept sets and a history of your previous actions.
      Your task is to decide on the SINGLE BEST next action to take to improve the concept sets.
      
      Available Tools:
      - `athena_search`: To find new initial candidates.
      - `athena_details`: To get more information on specific concepts (vocabulary, domain, standard status, relationships).
      - `athena_relationships`: To explore how concepts are connected (e.g., 'Maps to', 'Is a'). Use this to find standard concepts from non-standard ones.
      
      CRITICAL REQUIREMENTS:
      1. **Quick validation**: On your first turn, examine 1-2 key candidates using `athena_details` to verify they are standard SNOMED concepts.
      2. **Fast decision**: After 1-2 quality checks, you should be ready to finish. DO NOT over-explore.
      3. **Finish quickly**: If candidates look reasonable (standard SNOMED, correct domain, relevant names), call `finish` immediately.
      4. **Maximum 3 actions**: You should finish within 3 tool calls maximum. Exploration is optional if initial candidates look good.
      
      Strategy:
      1. **First turn**: Quickly check 1-2 candidates with `athena_details`. If they are standard SNOMED and relevant, prepare to finish.
      2. **Second turn (optional)**: Only if you found serious issues (non-standard, wrong domain), use one more tool to investigate.
      3. **Finish**: After 1-2 checks, call `finish` and provide all valid candidates in final_sets.
      4. **DO NOT OVER-EXPLORE**: The initial search already found good candidates. Your job is to validate and finish quickly.
      
      Output ONLY JSON with the schema: {"action": "tool" | "finish", "tool_name": str?, "tool_input": object?, "final_sets": object?}.
      - If action is "tool", provide `tool_name` and `tool_input`. Set `final_sets` to null.
      - If action is "finish", you MUST provide the complete `final_sets` with all concept sets and their candidates.
      - The `final_sets` structure is REQUIRED when finishing: {"concept_sets": [{"name": str, "included_concepts": [{concept_id, concept_name, domain_id, vocabulary_id, standard_concept, concept_code}, ...], "excluded_concepts": []}]}
      - CRITICAL: When you decide to finish, you MUST copy all valid candidates from current_sets into final_sets.included_concepts. DO NOT return null or empty final_sets.
    tools:
      - "skills.athena_tools:athena_search"
      - "skills.athena_tools:athena_details"
      - "skills.athena_tools:athena_relationships"
    output_schema:
      type: object
      properties:
        action: 
          type: string
          enum: [tool, finish]
        tool_name:
          type: string
          nullable: true
        tool_input:
          oneOf:
            - type: object
            - type: "null"
        final_sets:
          oneOf:
            - type: object
            - type: "null"
      required: [action]

steps:
  - kind: step
    name: parse_initial_payload
    uses: "skills.custom_tools:parse_initial_payload"
    input: "{{ context.initial_prompt }}"
    updates_context: true

  - kind: step
    name: decompose_concept_sets
    uses: agents.concept_decomposer
    input: "{{ context.scratchpad.cohort_definition }}"

  - kind: step
    name: normalize_concept_plan
    uses: "skills.custom_tools:ensure_concept_plan_dict"
    input: "{{ previous_step }}"

  - kind: step
    name: search_initial_candidates
    uses: "skills.athena_tools:athena_search_for_concept_plan"
    input: "{{ previous_step }}"
    updates_context: true

  # Debug step: Log state before exploration (can be removed in production)
  # - kind: step
  #   name: debug_before_exploration
  #   uses: "skills.custom_tools:debug_log_state"
  #   input: "{{ context.scratchpad }}"

  - kind: loop
    name: exploration_loop
    loop:
      body:
        - kind: step
          name: decide_next_action
          uses: agents.concept_explorer_agent
          input: |
            Cohort Definition: {{ context.scratchpad.cohort_definition }}
            Current Concept Sets: {{ context.scratchpad.concept_sets | tojson }}
            Exploration History: {{ context.scratchpad.exploration_history | tojson }}
            Refinement Feedback: {{ context.scratchpad.refinement_feedback or '' }}
          updates_context: true
        
        - kind: conditional
          name: execute_action
          condition_expression: "previous_step.action == 'tool'"
          branches:
            "true":
              - kind: step
                name: execute_tool
                uses: "skills.custom_tools:execute_athena_tool"
                input: "{{ steps.decide_next_action.output }}"
                updates_context: true
            "false":
              - kind: step
                name: no_tool_action
                agent: "flujo.builtins.passthrough"
      
      exit_expression: "steps['decide_next_action'].action == 'finish'"
      max_loops: 5

  - kind: step
    name: store_concept_sets
    uses: "skills.custom_tools:store_as_concept_sets"
    input: "{{ steps.decide_next_action.output.final_sets }}"
    updates_context: true

  - kind: step
    name: emit_for_parent
    uses: "skills.custom_tools:format_final_output"
    input: "{{ context.scratchpad.concept_sets }}"
